name: correction or compatibility bug
description: report a factual error, broken guide path, or archive compatibility problem
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: affected page or component
      placeholder: docs/guides/codex.md or plugins/cc
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: observed behavior
      description: include the product version, surface, and exact error or incorrect claim
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: supporting evidence
      description: link an official source or provide a minimal reproduction
    validations:
      required: true
