name: guide proposal
description: propose a source-backed addition to the field guide
labels: [content]
body:
  - type: input
    id: decision
    attributes:
      label: reader decision
      description: what decision would this addition help an experienced builder make?
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: primary layer
      options:
        - surface
        - harness
        - model
        - orchestration
        - shared operating practice
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: primary sources or tested evidence
      description: include official documentation, a source repository, or a reproducible test environment
    validations:
      required: true
