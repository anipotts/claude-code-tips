name: product freshness

on:
  schedule:
    - cron: "20 10 * * 1"
  workflow_dispatch:

concurrency:
  group: product-freshness
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.drift.outputs.changed }}
      codex: ${{ steps.versions.outputs.codex }}
      claude: ${{ steps.versions.outputs.claude }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: read current package versions
        id: versions
        shell: bash
        run: |
          echo "codex=$(npm view @openai/codex version 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "claude=$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: check versions, review windows, and watched source terms
        id: freshness
        continue-on-error: true
        env:
          LATEST_CODEX: ${{ steps.versions.outputs.codex }}
          LATEST_CLAUDE_CODE: ${{ steps.versions.outputs.claude }}
        run: python3 .github/scripts/check_sources.py --freshness

      - name: detect review need
        id: drift
        env:
          LATEST_CODEX: ${{ steps.versions.outputs.codex }}
          LATEST_CLAUDE_CODE: ${{ steps.versions.outputs.claude }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
        shell: bash
        run: |
          current_codex="$(jq -r '.product_versions.codex' docs/sources.json)"
          current_claude="$(jq -r '.product_versions.claude_code' docs/sources.json)"
          if [[ "$LATEST_CODEX" == "unknown" || "$LATEST_CLAUDE_CODE" == "unknown" ]]; then
            echo "package registry lookup failed" >&2
            exit 1
          fi
          if [[ "$current_codex" != "$LATEST_CODEX" || \
                "$current_claude" != "$LATEST_CLAUDE_CODE" || \
                "$FRESHNESS_OUTCOME" != "success" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: summarize detection
        if: always()
        env:
          CHANGED: ${{ steps.drift.outputs.changed }}
          CODEX: ${{ steps.versions.outputs.codex }}
          CLAUDE: ${{ steps.versions.outputs.claude }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
        run: |
          {
            echo "## product freshness"
            echo ""
            echo "- codex upstream: $CODEX"
            echo "- claude code upstream: $CLAUDE"
            echo "- review needed: ${CHANGED:-unknown}"
            echo "- source review check: $FRESHNESS_OUTCOME"
            echo "- detection permissions: contents read"
          } >> "$GITHUB_STEP_SUMMARY"

  draft:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      produced: ${{ steps.patch.outputs.produced }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - name: check drafting credential
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: collect official update context
        if: steps.key.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p .freshness
          curl --fail --location --silent --show-error https://developers.openai.com/codex/changelog > .freshness/codex-changelog.html
          curl --fail --location --silent --show-error https://code.claude.com/docs/en/changelog > .freshness/claude-code-changelog.html

      - name: draft dated handbook changes
        if: steps.key.outputs.available == 'true'
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        env:
          LATEST_CODEX: ${{ needs.detect.outputs.codex }}
          LATEST_CLAUDE_CODE: ${{ needs.detect.outputs.claude }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          codex-version: ${{ needs.detect.outputs.codex }}
          prompt: |
            Update this handbook for the detected Codex or Claude Code version change.
            Read AGENTS.md, docs/sources.json, and the official snapshots under .freshness/.
            Update the version registry and only public claims directly supported by those official snapshots.
            Phrase date sensitive claims as "as of <month day, year>" in the existing lowercase voice.
            Preserve citations, limitations, and the distinction between official source and hands on evidence.
            Do not invent a field run, benchmark, recommendation, or product capability.
            Remove .freshness before finishing. Run bun install --frozen-lockfile, bun run check, bun run build, and bun run test:site.

      - name: validate and package draft
        if: steps.key.outputs.available == 'true'
        id: patch
        shell: bash
        run: |
          rm -rf .freshness
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "the agent produced no supported handbook change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/check_freshness_diff.py --base HEAD
          git add -N README.md content docs
          git diff --binary HEAD > "$RUNNER_TEMP/freshness.patch"
          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: upload reviewed path patch
        if: steps.patch.outputs.produced == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freshness-patch
          path: ${{ runner.temp }}/freshness.patch
          if-no-files-found: error
          retention-days: 1

      - name: explain unavailable drafting
        if: steps.key.outputs.available != 'true'
        run: echo "product drift was detected, but OPENAI_API_KEY is unavailable; no draft was created" >> "$GITHUB_STEP_SUMMARY"

  publish-draft:
    needs: [detect, draft]
    if: needs.draft.outputs.produced == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: freshness-patch
          path: ${{ runner.temp }}

      - name: apply and verify isolated patch
        run: |
          git apply --index "$RUNNER_TEMP/freshness.patch"
          python3 .github/scripts/check_freshness_diff.py --base HEAD
          bun install --frozen-lockfile
          bun run check:readme
          bun run check
          bun run build
          bun run test:site

      - name: open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/freshness-${{ github.run_id }}
        shell: bash
        run: |
          git config user.name "coding agent tips freshness"
          git config user.email "codex@anipotts.com"
          git switch -c "$BRANCH"
          git commit -m "docs: draft dated product updates"
          git push --set-upstream origin "$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" --title "docs: draft dated product updates" --body "Automated draft from official product changelogs. Review every claim, citation, and wording choice before merge."
