name: freshness check

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: read current package versions
        id: versions
        shell: bash
        run: |
          echo "codex=$(npm view @openai/codex version 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "claude=$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: check freshness
        env:
          LATEST_CODEX: ${{ steps.versions.outputs.codex }}
          LATEST_CLAUDE_CODE: ${{ steps.versions.outputs.claude }}
        run: python3 .github/scripts/check_sources.py --freshness

      - name: write summary
        if: always()
        run: |
          {
            echo "## handbook freshness"
            echo ""
            echo "- codex upstream: ${{ steps.versions.outputs.codex }}"
            echo "- claude code upstream: ${{ steps.versions.outputs.claude }}"
            echo "- registry: docs/sources.json"
            echo "- this workflow has read-only repository permissions"
          } >> "$GITHUB_STEP_SUMMARY"
