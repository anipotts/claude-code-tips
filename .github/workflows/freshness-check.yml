name: freshness check

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: read current package versions
        id: versions
        shell: bash
        run: |
          echo "codex=$(npm view @openai/codex version 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "claude=$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: check versions, review windows, and watched source terms
        env:
          LATEST_CODEX: ${{ steps.versions.outputs.codex }}
          LATEST_CLAUDE_CODE: ${{ steps.versions.outputs.claude }}
        run: python3 .github/scripts/check_sources.py --freshness

      - name: write summary
        if: always()
        run: |
          {
            echo "## guide freshness"
            echo ""
            echo "- codex upstream: ${{ steps.versions.outputs.codex }}"
            echo "- claude code upstream: ${{ steps.versions.outputs.claude }}"
            echo "- registry: docs/sources.json"
            echo "- watched source terms: core and stable references"
            echo "- repository permissions: read only"
          } >> "$GITHUB_STEP_SUMMARY"
