name: legacy plugin smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "examples/**"
      - "hooks/**"
      - "plugins/**"
      - "bun.lock"
      - ".github/workflows/plugin-smoke-test.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "examples/**"
      - "hooks/**"
      - "plugins/**"
      - "bun.lock"
      - ".github/workflows/plugin-smoke-test.yml"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - name: install test dependencies
        run: python3 -m pip install pytest==9.0.2

      - name: validate manifests and scripts
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          for path in pathlib.Path(".").glob("**/plugin.json"):
              with path.open(encoding="utf-8") as handle:
                  data = json.load(handle)
              for field in ("name", "version", "description"):
                  if not data.get(field):
                      raise SystemExit(f"{path}: missing {field}")
          PY
          find hooks plugins -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m compileall -q plugins

      - name: test cc
        working-directory: plugins/cc
        run: |
          bun install --frozen-lockfile
          bun test tests

      - name: test lore
        run: python3 -m pytest plugins/lore/tests
