name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: validate source registry
        run: python3 .github/scripts/check_sources.py

      - name: validate json and python
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import py_compile
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for raw in tracked:
              path = pathlib.Path(raw)
              if path.suffix == ".json":
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)
              elif path.suffix == ".py":
                  py_compile.compile(str(path), doraise=True)
          PY

      - name: validate shell scripts
        shell: bash
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: reject private artifacts and misleading prose
        shell: bash
        run: |
          if git ls-files content data handoffs | grep -q .; then
            echo "private artifact directories must not contain tracked files"
            exit 1
          fi

          if git grep -n $'\u2014' -- README.md README.*.md AGENTS.md CLAUDE.md CONTRIBUTING.md SECURITY.md 'docs/**' '.claude-plugin/*.json'; then
            echo "em dashes are outside the repository style"
            exit 1
          fi

          if git grep -n -iE 'maintained by someone who uses claude code as their job|where (claude code|codex) wins|no FUD|last-commit' -- '*.md' ':(exclude)CHANGELOG.md'; then
            echo "stale authority or winner framing found"
            exit 1
          fi

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: |
            README*.md
            AGENTS.md
            CLAUDE.md
            CONTRIBUTING.md
            SECURITY.md
            docs/**/*.md
            hooks/README.md
            plugins/README.md
            plugins/cc/README.md
            plugins/lore/README.md
            examples/README.md

      - name: check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .github/lychee.toml
            --no-progress
            "README*.md"
            "AGENTS.md"
            "CLAUDE.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "docs/**/*.md"
            "hooks/README.md"
            "plugins/README.md"
            "plugins/cc/README.md"
            "plugins/lore/README.md"
            "examples/README.md"
          fail: true
