name: manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: existing git tag to publish
        required: true
        type: string
      prerelease:
        description: mark as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null
          test "$RELEASE_TAG" = "v4.0.0" || [[ "$RELEASE_TAG" == legacy-tools-final-* ]]

      - name: publish existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=("$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
