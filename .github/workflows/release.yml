name: manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: existing signed tag with a reviewed draft release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: verify signed tag and reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] && \
             [[ "$RELEASE_TAG" != "legacy-tools-final-2026-11-05" ]]; then
            echo "release tag must be semantic or the exact final archive tag"
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          git tag -v "$RELEASE_TAG"
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,tagName)"
          test "$(jq -r '.tagName' <<< "$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' <<< "$release_json")" = "true"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publish reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release edit "$RELEASE_TAG" --draft=false
          echo "published the existing reviewed draft for $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
