name: manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: existing signed tag with a reviewed draft release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-id: ${{ steps.release-input.outputs.release-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: verify signed tag and reviewed draft
        id: release-input
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] && \
             [[ "$RELEASE_TAG" != "legacy-tools-final-2026-11-05" ]]; then
            echo "release tag must be semantic or the exact final archive tag"
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          tag_object_sha="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          tag_verification="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            --jq '.verification')"
          test "$(jq -r '.verified' <<< "$tag_verification")" = "true"
          test "$(jq -r '.reason' <<< "$tag_verification")" = "valid"
          release_json="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            jq -s --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] |
               if length == 1 then .[0]
               else error("expected exactly one release for tag " + $tag)
               end')"
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<< "$release_json")" = "true"
          echo "release-id=$(jq -r '.id' <<< "$release_json")" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publish reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ needs.verify.outputs.release-id }}
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<< "$release_json")" = "true"
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false >/dev/null
          echo "published the existing reviewed draft for $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
