# lychee link checker config for coding agent tips

# accept these status codes as valid (429 = rate limited, 403 = auth-walled)
accept = [200, 204, 301, 302, 403, 429]

# timeout per request
timeout = 30

# max concurrent requests (be polite)
max_concurrency = 4

# retry failed requests
max_retries = 3

# exclude patterns
exclude = [
  # localhost / loopback
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://0\\.0\\.0\\.0",
  # branch routes are built and resolved by test:site before they exist in production
  "^https://agents\\.anipotts\\.com/",
  # github links that need auth or are flaky
  "^https://github\\.com/.*/edit/",
  "^https://github\\.com/.*/new/",
  "^https://github\\.com/.*/actions/workflows/.*\\.yml/badge\\.svg",
  # placeholder domains
  "^https?://example\\.com",
  "^https?://your-",
  # mail links
  "^mailto:",
  # anthropic docs (reorganize frequently, intermittent 500s)
  "^https://docs\\.anthropic\\.com",
  # shields.io endpoint badges (depend on external gist data)
  "^https://img\\.shields\\.io/endpoint",
  # ar5iv paper figures reject automated HEAD requests while their source papers remain checked
  "^https://ar5iv\\.labs\\.arxiv\\.org/html/.*/assets/",
  # gist raw content (dynamic, may 404 before first push)
  "^https://gist\\.githubusercontent\\.com",
  # same-repository main-branch links can target files introduced by the PR;
  # the local validator resolves every matching Markdown and field-run target
  "^https://github\\.com/anipotts/coding-agent-tips/blob/main/",
]

# exclude paths that are gitignored or not actual documentation
exclude_path = [
  "data/",
  "node_modules/",
  ".git/",
  "gifs/",
]
