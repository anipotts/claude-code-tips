# lychee link checker config for claude-code-tips

# accept these status codes as valid (429 = rate limited, 403 = auth-walled)
accept = [200, 204, 301, 302, 403, 429]

# timeout per request
timeout = 30

# max concurrent requests (be polite)
max_concurrency = 4

# retry failed requests
max_retries = 3

# exclude localhost and local file references
exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://0\\.0\\.0\\.0",
  # github edit/new-file links break without auth
  "^https://github\\.com/.*/edit/",
  "^https://github\\.com/.*/new/",
  # github actions badge URLs can be flaky
  "^https://github\\.com/.*/actions/workflows/.*\\.yml/badge\\.svg",
  # example/placeholder domains
  "^https?://example\\.com",
  "^https?://your-",
]

# exclude paths that are gitignored or not actual documentation
exclude_path = [
  "content/",
  "data/",
  "node_modules/",
  ".git/",
  "gifs/",
]

# don't check mail links
exclude_mail = true
